name: Causora Heartbeat
on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - name: Read live attestation frontier (read-only, no key, no gas)
        run: node scripts/heartbeat.js
      - name: Commit the growing record
        run: |
          git config user.name "causora-heartbeat"
          git config user.email "actions@github.com"
          git add evidence/heartbeat.jsonl
          if git commit -m "heartbeat: $(date -u +%Y-%m-%dT%H:%M:%SZ)"; then
            git pull --rebase origin main || true
            git push origin main
          else
            echo "no change"
          fi
