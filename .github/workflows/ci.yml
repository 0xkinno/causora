name: Causora CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    name: Test Suite & Claims Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Compile smart contracts
        run: npm run compile
      - name: Run test suite
        run: npm test
      - name: Check claims integrity (prevent drift)
        run: npm run check:claims
